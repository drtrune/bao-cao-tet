<!-- MODAL: CHI TIẾT BỆNH NHÂN -->
<div id="patientModal" class="modal-overlay" style="display:none;">
    <div class="modal-container">
        <div class="modal-header">
            <h3 id="patientModalTitle"><i class="fas fa-user-injured mr-2 text-blue-600"></i>Thêm mới bệnh nhân</h3>
            <button onclick="closePatientModal()" class="text-slate-400 hover:text-red-500 text-xl"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="bnEditIndex" value="-1">

            <!-- I. THÔNG TIN HÀNH CHÍNH -->
            <div class="modal-section-title">I. THÔNG TIN HÀNH CHÍNH</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Mã hồ sơ bệnh án<span class="required">*</span></label>
                    <input type="text" id="bnMaHSBA" placeholder="Nhập mã HSBA">
                </div>
                <div class="form-group">
                    <label>Mã bệnh nhân</label>
                    <input type="text" id="bnMaBN" placeholder="Mã BN">
                </div>
                <div class="form-group">
                    <label>Họ và tên<span class="required">*</span></label>
                    <input type="text" id="bnHoTen" placeholder="Họ và tên đầy đủ">
                </div>
                <div class="form-group">
                    <label>Ngày sinh</label>
                    <input type="date" id="bnNgaySinh">
                </div>
                <div class="form-group">
                    <label>Tuổi</label>
                    <input type="number" id="bnTuoi" placeholder="Tuổi" min="0" max="150">
                </div>
                <div class="form-group">
                    <label>Giới tính</label>
                    <select id="bnGioiTinh">
                        <option value="Nam">Nam</option>
                        <option value="Nữ">Nữ</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Dân tộc</label>
                    <input type="text" id="bnDanToc" placeholder="Kinh">
                </div>
                <div class="form-group">
                    <label>Quốc tịch</label>
                    <input type="text" id="bnQuocTich" placeholder="Việt Nam">
                </div>
                <div class="form-group">
                    <label>Loại giấy tờ tùy thân</label>
                    <select id="bnLoaiGiayTo">
                        <!-- Render từ APP_CONFIG.danhMuc.LOAI_GIAY_TO -->
                    </select>
                </div>
                <div class="form-group">
                    <label>Số giấy tờ</label>
                    <input type="text" id="bnSoGiayTo" placeholder="Số CCCD/CMND/Hộ chiếu">
                </div>
                <div class="form-group">
                    <label>Ngày cấp</label>
                    <input type="date" id="bnNgayCap">
                </div>
                <div class="form-group">
                    <label>Nơi cấp</label>
                    <input type="text" id="bnNoiCap" placeholder="Nơi cấp">
                </div>
                <div class="form-group">
                    <label>Mã thẻ BHYT</label>
                    <input type="text" id="bnBHYT" placeholder="Mã thẻ BHYT">
                </div>
            </div>

            <!-- II. ĐỊA CHỈ & NƠI PHÁT HIỆN -->
            <div class="modal-section-title">II. ĐỊA CHỈ & NƠI PHÁT HIỆN</div>
            <div class="flex flex-col gap-3">
                <div class="border p-2 rounded bg-slate-50">
                    <div class="font-bold text-blue-800 mb-1 border-b pb-1">A. Địa chỉ thường trú</div>
                    <div class="flex gap-2">
                        <div class="w-1/3"><label class="text-[10px]">Tỉnh/TP</label><input type="text" id="bnTinh" placeholder="Tỉnh/TP" class="w-full text-xs"></div>
                        <div class="w-1/3"><label class="text-[10px]">Phường/Xã</label><input type="text" id="bnXa" placeholder="Phường/Xã" class="w-full text-xs"></div>
                        <div class="w-1/3"><label class="text-[10px]">Thôn/số nhà</label><input type="text" id="bnThon" placeholder="Chi tiết" class="w-full text-xs"></div>
                    </div>
                </div>
                <div class="border p-2 rounded bg-white">
                    <div class="flex justify-between items-center mb-1 border-b pb-1">
                        <div class="font-bold text-green-800">B. Chỗ ở hiện tại</div>
                        <button type="button" onclick="copyAddress('bn', 'bnHT')" class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded hover:bg-blue-200"><i class="fas fa-copy mr-1"></i>Giống thường trú</button>
                    </div>
                    <div class="flex gap-2">
                        <div class="w-1/3"><label class="text-[10px]">Tỉnh/TP</label><input type="text" id="bnHTTinh" placeholder="Tỉnh/TP" class="w-full text-xs"></div>
                        <div class="w-1/3"><label class="text-[10px]">Phường/Xã</label><input type="text" id="bnHTXa" placeholder="Phường/Xã" class="w-full text-xs"></div>
                        <div class="w-1/3"><label class="text-[10px]">Thôn/số nhà</label><input type="text" id="bnHTThon" placeholder="Chi tiết" class="w-full text-xs"></div>
                    </div>
                </div>
                <div class="border p-2 rounded bg-orange-50">
                    <div class="flex justify-between items-center mb-1 border-b pb-1">
                        <div class="font-bold text-orange-800">C. Nơi phát hiện / Xảy ra tai nạn</div>
                        <button type="button" onclick="copyAddress('bn', 'bnPH')" class="text-[10px] bg-orange-200 text-orange-800 px-2 py-0.5 rounded hover:bg-orange-300"><i class="fas fa-copy mr-1"></i>Giống thường trú</button>
                    </div>
                    <div class="flex gap-2">
                        <div class="w-1/3"><label class="text-[10px]">Tỉnh/TP</label><input type="text" id="bnPHTinh" placeholder="Tỉnh/TP" class="w-full text-xs"></div>
                        <div class="w-1/3"><label class="text-[10px]">Phường/Xã</label><input type="text" id="bnPHXa" placeholder="Phường/Xã" class="w-full text-xs"></div>
                        <div class="w-1/3"><label class="text-[10px]">Thôn/số nhà</label><input type="text" id="bnPHThon" placeholder="Chi tiết" class="w-full text-xs"></div>
                    </div>
                </div>
            </div>

            <!-- III. THÔNG TIN Y KHOA -->
            <div class="modal-section-title mt-4">III. THÔNG TIN Y KHOA</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Lý do vào viện<span class="required">*</span></label>
                    <select id="bnLyDo">
                        <!-- Render từ APP_CONFIG.danhMuc.LY_DO -->
                    </select>
                </div>  
                <div class="form-group">
                    <label>Ngày xảy ra tai nạn</label>
                    <input type="datetime-local" id="bnNgayTaiNan">
                </div>
                <div class="form-group">
                    <label>Ngày vào viện</label>
                    <input type="datetime-local" id="bnNgayVao">
                </div>
                <div class="form-group">
                    <label>Ngày ra viện / Tử vong</label>
                    <input type="datetime-local" id="bnNgayRa">
                </div>
                <div class="form-group">
                    <label>Kết quả điều trị</label>
                    <select id="bnKetQua">
                        <!-- Render từ APP_CONFIG.danhMuc.KET_QUA -->
                    </select>
                </div>
                <div class="form-group">
                    <label>Tình trạng ra viện</label>
                    <select id="bnTinhTrang">
                        <!-- Render từ APP_CONFIG.danhMuc.TINH_TRANG -->
                    </select>
                </div>
                <div class="form-group col-span-2">
                    <label>Chuyển từ (nếu có)</label>
                    <input type="text" id="bnChuyenTu" placeholder="Tên bệnh viện chuyển đến">
                </div>
            </div>
                
            <div class="mt-2 text-xs">
                <label class="font-bold mb-1 block">Chẩn đoán ra viện (tóm tắt)</label>
                <textarea id="bnChanDoan" rows="2" class="w-full border rounded p-1" placeholder="Nhập chẩn đoán tóm tắt..."></textarea>
            </div>
            
            <div class="border p-2 rounded bg-slate-50 mt-2 text-xs">
                <div class="flex justify-between items-center mb-2">
                    <label class="font-bold text-blue-800">Bảng chẩn đoán chi tiết</label>
                    <button type="button" onclick="addDiagnosisRow()" class="text-xs bg-blue-600 text-white px-2 py-1 rounded hover:bg-blue-700 shadow"><i class="fas fa-plus mr-1"></i>Thêm chẩn đoán</button>
                </div>
                <table class="w-full border-collapse bg-white border" id="diagnosisTable">
                    <thead class="bg-slate-200 font-bold text-slate-700">
                        <tr>
                            <th class="p-1 border text-left w-1/4">Loại chẩn đoán</th>
                            <th class="p-1 border text-left">Chẩn đoán</th>
                            <th class="p-1 border text-left w-24">Mã ICD</th>
                            <th class="p-1 border text-center" style="width: 40px;">Xóa</th>
                        </tr>
                    </thead>
                    <tbody id="diagnosisTableBody"></tbody>
                </table>
            </div>

            <div class="border-t pt-2 mt-2 text-xs">
                <label class="font-bold block mb-1"><i class="fas fa-paperclip mr-1"></i>File Tóm tắt HSBA (PDF/DOCX)</label>
                <input type="file" id="bnFileHSBA" accept=".pdf, .docx, .doc" class="block w-full text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                <div class="text-[10px] text-slate-500 mt-1 italic" id="fileHelpText">Vui lòng chọn file văn bản (PDF, Word).</div>
                <div id="fileLinkDisplay" style="display:none;" class="mt-1"></div>
            </div>
        </div>
        <div class="modal-footer">
            <button onclick="closePatientModal()" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-lg font-bold text-xs hover:bg-slate-200">Hủy</button>
            <button id="btnSavePatient" onclick="savePatientFromModal()" class="px-5 py-2 bg-blue-700 text-white rounded-lg font-bold text-xs hover:bg-blue-800"><i class="fas fa-save mr-1"></i>Lưu</button>
        </div>
    </div>
</div>
