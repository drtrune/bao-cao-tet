<script>
    /** 
     * BIẾN TOÀN CỤC VÀ CẤU HÌNH API
     */
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzDfIkgCWIysNyG-yFq3urSMPYdGWGcB4L8AU4cb5-Jv8bNm9az3zGleiPTcwfcnDnkyw/exec"; 

    /** Hàm gọi API chung đến Backend (Google Apps Script) */
    async function callBackend(action, payload = {}) {
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                body: JSON.stringify({ action: action, payload: payload })
            });
            
            const result = await response.json();
            
            if (result.status === 'success') {
                return result.data;
            } else {
                throw new Error(result.message || 'Lỗi xử lý từ máy chủ');
            }
        } catch (err) {
            console.error("Lỗi khi gọi API: ", err);
            throw err;
        }
    }

    /** Hàm upload file qua POST request (fetch) */
    async function uploadFileViaPost(fileData) {
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'uploadFile',
                    filename: fileData.name,
                    mimetype: fileData.mimeType,
                    data: fileData.data
                })
            });
            const result = await response.json();
            if (result.status === 'success') {
                return { success: true, url: result.url };
            } else {
                return { success: false, error: result.message || 'Unknown error' };
            }
        } catch (e) {
            return { success: false, error: e.toString() };
        }
    }

    /** Đọc file thành base64 */
    function readFileAsBase64(fileInput) {
        return new Promise((resolve, reject) => {
            if (!fileInput.files || fileInput.files.length === 0) {
                resolve(null);
                return;
            }
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = () => {
                const base64 = reader.result.split(',')[1];
                resolve({ name: file.name, mimeType: file.type, data: base64 });
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }
</script>
