# Workflow để deploy song song branch main (root) và branch test (/test)
name: Deploy Multi-Branch to Pages

on:
  push:
    branches: ["main", "test"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main_branch

      - name: Checkout Test branch
        uses: actions/checkout@v4
        with:
          ref: test
          path: test_branch

      - name: Build Deployment Folder
        run: |
          mkdir dist
          # Copy main vào root của dist
          cp -r main_branch/* dist/
          # Tạo folder test và copy branch test vào
          mkdir -p dist/test
          cp -r test_branch/* dist/test/
          # Xóa các folder workflow trong dist để sạch sẽ
          rm -rf dist/.github
          rm -rf dist/test/.github

      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
