<script>
    /**
     * XỬ LÝ LOAD DỮ LIỆU, SUBMIT VÀ KHỞI TẠO FORM
     */

    /** Gọi khi thay đổi khoa hoặc ngày để load dữ liệu cũ */
    function onDateOrDeptChange() {
        const khoa = document.getElementById('khoaBaoCao').value;
        const ngay = document.getElementById('ngayTruc').value;
        if (!khoa || !ngay) return;
        
        const banner = document.getElementById('loadStatusBanner');
        banner.className = 'mb-4 p-3 rounded-xl text-sm font-bold text-center bg-blue-50 text-blue-700 block';
        banner.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Đang kiểm tra dữ liệu...';
        
        loadExistingReport(khoa, ngay);
    }

    /** Gọi backend để lấy dữ liệu đã gửi trước đó */
    async function loadExistingReport(khoa, ngay) {
        const banner = document.getElementById('loadStatusBanner');
        const loadTimeout = setTimeout(() => {
            resetForm();
            banner.className = 'mb-4 p-3 rounded-xl text-sm font-bold text-center bg-green-50 border border-green-300 text-green-700';
            banner.innerHTML = '🆕 Tạo báo cáo mới.';
            setTimeout(() => { banner.className = 'hidden'; }, 3000);
        }, 10000);

        try {
            const data = await callBackend('getExistingReport', { khoa: khoa, ngay: ngay });
            clearTimeout(loadTimeout);
            if (data && (data.found || data.failButFoundPrev)) {
                fillFormWithData(data);
                if (data.found) {
                     banner.className = 'mb-4 p-3 rounded-xl text-sm font-bold text-center bg-amber-50 border border-amber-300 text-amber-800';
                     banner.innerHTML = '📝 Đang sửa báo cáo đã gửi trước đó. Nhấn "Gửi" để cập nhật.';
                } else {
                     banner.className = 'mb-4 p-3 rounded-xl text-sm font-bold text-center bg-purple-50 border border-purple-300 text-purple-700';
                     banner.innerHTML = '🆗 Đã tìm thấy số liệu "Hiện có" từ ngày hôm qua để điền vào "BN cũ" hôm nay.';
                     setTimeout(() => { banner.classList.add('hidden'); }, 8000);
                }
            } else {
                resetForm();
                banner.className = 'mb-4 p-3 rounded-xl text-sm font-bold text-center bg-green-50 border border-green-300 text-green-700';
                banner.innerHTML = '🆕 Tạo báo cáo mới (Chưa có dữ liệu cũ).';
                setTimeout(() => { banner.className = 'hidden'; }, 3000);
            }
        } catch (error) {
            clearTimeout(loadTimeout);
            banner.className = 'hidden';
        }
    }

    /** Điền dữ liệu cũ vào form */
    function fillFormWithData(data) {
        const statRows = document.querySelectorAll('#statsTableBody tr');
        if (data.thongKe) {
            const norm = s => (s || '').replace(/\*/g, '').trim();
            const rowMap = {};
            ROW_NAMES.forEach((name, idx) => { rowMap[norm(name)] = idx; });

            data.thongKe.forEach((tk, idx) => {
                const key = norm(tk.doiTuong);
                let targetIdx = rowMap[key];
                if (targetIdx === undefined) targetIdx = idx;
                if (targetIdx >= statRows.length) return;
                
                const row = statRows[targetIdx];
                if (!row || row.classList.contains('total-row')) return;

                const inputs = row.querySelectorAll('input');
                COL_CODES.forEach((code, i) => {
                    const val = tk[`c${code}`];
                    if(inputs[i]) inputs[i].value = val || 0;
                });
                if(inputs[COL_CODES.length]) inputs[COL_CODES.length].value = tk.c72 || 0;
                calc71(targetIdx);
            });
        }

        if (data.chiSo) {
            var chiSoList = (window.APP_CONFIG || {}).chiSoKhac || [];
            chiSoList.forEach(function(cs) {
                var el = document.getElementById(cs.inputId);
                if (el) el.value = data.chiSo[cs.ma] || 0;
            });
        }

        if (data.sdtNguoiBaoCao) document.getElementById('sdtNguoiBaoCao').value = data.sdtNguoiBaoCao;

        patientDataList = [];
        if (data.benhNhan) {
            data.benhNhan.forEach(bn => {
                patientDataList.push({ ...bn, fileHSBA: null });
            });
        }
        renderPatientTable();
        updateInputState(document.getElementById('khoaBaoCao').value);
        calcTotals();
    }

    /** Reset form */
    function resetForm() {
        document.querySelectorAll('#statsTableBody tr').forEach(function(tr, idx) {
            if (tr.classList.contains('total-row')) return;
            tr.querySelectorAll('input').forEach(function(inp) { inp.value = 0; });
            var res71 = document.querySelectorAll('.res-71')[idx];
            if (res71) res71.innerText = 0;
        });
        var chiSoList = (window.APP_CONFIG || {}).chiSoKhac || [];
        chiSoList.forEach(function(cs) {
            var el = document.getElementById(cs.inputId);
            if (el) el.value = 0;
        });
        patientDataList = [];
        renderPatientTable();
        updateInputState(document.getElementById('khoaBaoCao').value);
        calcTotals();
    }

    /** Submit báo cáo */
    async function handleSubmit() {
        const khoa = document.getElementById('khoaBaoCao').value;
        const ngay = document.getElementById('ngayTruc').value;
        if(!khoa || !ngay) { alert("⚠️ Vui lòng chọn Khoa và Ngày!"); return; }
        
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; 
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>ĐANG XỬ LÝ...';

        // Upload files
        for (let i = 0; i < patientDataList.length; i++) {
            const p = patientDataList[i];
            if (p.fileHSBA?.data) {
                try {
                    const result = await uploadFileViaPost(p.fileHSBA);
                    if (result.success) {
                        p.fileHSBAUrl = result.url;
                        delete p.fileHSBA; 
                    }
                } catch (e) { console.error("Lỗi upload file", e); }
            }
        }

        const chiSoKhac = (window.APP_CONFIG || {}).chiSoKhac || [];
        const chiSoPayload = {};
        chiSoKhac.forEach(function(cs) {
            const el = document.getElementById(cs.inputId);
            chiSoPayload[cs.ma] = el ? el.value : 0;
        });

        const doiTuongList = (window.APP_CONFIG || {}).doiTuong || [];
        const payload = {
            khoa: khoa, 
            ngay: ngay, 
            sdtNguoiBaoCao: document.getElementById('sdtNguoiBaoCao')?.value || '',
            filesToDelete: patientDataList.map(function(p) { return p.fileToDelete; }).filter(function(url) { return url; }),
            chiSo: chiSoPayload,
            thongKe: Array.from(document.querySelectorAll('#statsTableBody tr')).map(function(tr, idx) {
                const dt = doiTuongList[idx];
                if (!dt || dt.laDongTong) return null;
                const inputs = tr.querySelectorAll('input');
                const rowData = { doiTuong: dt.ten };
                COL_CODES.forEach(function(code, colIdx) { rowData['c' + code] = inputs[colIdx].value; });
                rowData.c71 = tr.querySelector('.res-71')?.innerText || '0';
                rowData.c72 = inputs[COL_CODES.length]?.value || '0';
                return rowData;
            }).filter(Boolean),
            benhNhan: patientDataList
        };

        try {
            await callBackend('saveReport', payload);
            btn.innerText = "GỬi THÀNH CÔNG!"; 
            btn.classList.replace('bg-blue-700', 'bg-green-600');
            document.getElementById('statusMsg').innerHTML = '<span class="text-green-600">✅ Số liệu đã lưu vào hệ thống.</span>';
            setTimeout(() => { 
                btn.disabled = false; 
                btn.innerHTML = 'GỬi BáO CÁO TRỰC <i class="fas fa-paper-plane ml-2"></i>'; 
                btn.classList.replace('bg-green-600', 'bg-blue-700'); 
            }, 4000);
        } catch (error) {
            btn.disabled = false;
            btn.innerHTML = 'GỬi BáO CÁO TRỰC <i class="fas fa-paper-plane ml-2"></i>';
            document.getElementById('statusMsg').innerHTML = `<span class="text-red-600">❌ Lỗi: ${error.message}</span>`;
        }
    }

    /** Render dropdown từ config danh mục */
    function renderConfigDropdowns() {
        const danhMuc = (window.APP_CONFIG || {}).danhMuc || {};
        const dropdowns = [
            { selectId: 'bnLyDo', nhom: 'LY_DO', hasEmpty: false },
            { selectId: 'bnKetQua', nhom: 'KET_QUA', hasEmpty: false },
            { selectId: 'bnTinhTrang', nhom: 'TINH_TRANG', hasEmpty: true, emptyText: '-- Chọn --' },
            { selectId: 'bnLoaiGiayTo', nhom: 'LOAI_GIAY_TO', hasEmpty: true, emptyText: '-- Chọn --' }
        ];
        dropdowns.forEach(function(cfg) {
            const select = document.getElementById(cfg.selectId);
            if (!select) return;
            select.innerHTML = '';
            if (cfg.hasEmpty) {
                const emptyOpt = document.createElement('option');
                emptyOpt.value = '';
                emptyOpt.textContent = cfg.emptyText || '-- Chọn --';
                select.appendChild(emptyOpt);
            }
            const items = danhMuc[cfg.nhom] || {};
            Object.keys(items).forEach(function(ma) {
                const opt = document.createElement('option');
                opt.value = ma;
                opt.textContent = items[ma].label || ma;
                select.appendChild(opt);
            });
        });
    }

    /** Cập nhật tiêu đề trang từ config */
    function renderAppTitles() {
        const appCfg = (window.APP_CONFIG || {}).app || {};
        const titleEl = document.getElementById('reportMainTitle');
        const subtitleEl = document.getElementById('reportSubTitle');
        const footerEl = document.getElementById('appFooter');
        if (titleEl && appCfg.REPORT_TITLE) titleEl.textContent = appCfg.REPORT_TITLE;
        if (subtitleEl && appCfg.REPORT_SUBTITLE) subtitleEl.textContent = appCfg.REPORT_SUBTITLE;
        if (footerEl && appCfg.FOOTER_TEXT) footerEl.textContent = appCfg.FOOTER_TEXT;
        if (appCfg.APP_TITLE) document.title = appCfg.APP_TITLE;
    }

    /** Khởi tạo khi load trang */
    window.onload = function() {
        // Render UI động từ config
        renderKhoaDropdown();
        renderChiSoSections();
        renderConfigDropdowns();
        renderAppTitles();
        initStatsTable();

        const vnNow = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Ho_Chi_Minh' }));
        const yyyy = vnNow.getFullYear();
        const mm = String(vnNow.getMonth() + 1).padStart(2, '0');
        const dd = String(vnNow.getDate()).padStart(2, '0');
        const todayStr = yyyy + '-' + mm + '-' + dd;
        
        ['ngayTruc', 'dateStartReport', 'dateEndReport', 'trackingStart', 'trackingEnd'].forEach(function(id) {
            const el = document.getElementById(id);
            if (el) el.value = todayStr;
        });

        const bnNgaySinh = document.getElementById('bnNgaySinh');
        if (bnNgaySinh) {
            bnNgaySinh.addEventListener('change', function() {
                const dob = new Date(this.value);
                if (isNaN(dob.getTime())) return;
                const today = new Date();
                let age = today.getFullYear() - dob.getFullYear();
                const m = today.getMonth() - dob.getMonth();
                if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;
                document.getElementById('bnTuoi').value = age >= 0 ? age : 0;
            });
        }
    };
</script>
